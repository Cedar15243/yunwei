<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>叮当 AI 运维助手 - 白色效果稿</title>
  <style>
    :root { --ink:#172523; --muted:#697975; --line:#dce7e3; --canvas:#f3f7f6; --surface:#fff; --soft:#f7fbfa; --mint:#e9f6f1; --green:#0c8b68; --green-dark:#076d52; --warn:#c65a17; --shadow:0 14px 36px rgba(28,63,54,.08); }
    *{box-sizing:border-box} body{margin:0;min-width:320px;background:var(--canvas);color:var(--ink);font-family:"Microsoft YaHei","Noto Sans SC",sans-serif} button{font:inherit}
    .app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;background:linear-gradient(90deg,rgba(12,139,104,.025) 1px,transparent 1px) 0 0/96px 96px,linear-gradient(rgba(12,139,104,.025) 1px,transparent 1px) 0 0/96px 96px,var(--canvas)}
    .topbar{height:68px;padding:0 clamp(18px,4vw,72px);display:flex;align-items:center;justify-content:space-between;gap:18px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
    .title,.actions,.state,.brand,.msg-head,.shot-row,.dock,.dock-status,.dock-actions,.conversation-head{display:flex;align-items:center}.title{gap:10px;min-width:0}.actions{gap:16px}.icon{width:34px;height:34px;border:0;border-radius:6px;background:transparent;color:#30403c;display:grid;place-items:center;cursor:pointer;font-size:20px}.icon:hover,.action:hover{border-color:#96cab8;background:var(--soft)}
    .page-title{min-width:0}.page-title strong{display:block;font-size:18px;line-height:1.2}.page-title strong span{color:#71817c;font-weight:500}.page-title>span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.state{min-height:30px;gap:7px;padding:0;color:#4a7165;font-size:13px;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:#19a574;box-shadow:0 0 0 4px rgba(25,165,116,.12)}.state small{display:none}
    main{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:clamp(30px,5.5vh,64px) 0 42px}.brand{gap:10px}.mark{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;background:var(--green);color:#fff;font-weight:800}.brand b{font-size:14px}.brand span{display:block;margin-top:3px;color:var(--muted);font-size:12px}.conversation-head{justify-content:space-between;gap:16px;margin:0 0 22px -31px;padding:0 0 15px 31px;border-bottom:1px solid var(--line)}.conversation-head .hint{color:var(--muted);font-size:12px}
    .timeline{position:relative;padding-left:31px}.timeline:before{content:"";position:absolute;left:10px;top:9px;bottom:19px;width:1px;background:#cfe4dc}.entry{position:relative;padding-bottom:28px}.entry:before{content:"";position:absolute;left:-27px;top:9px;width:9px;height:9px;border:3px solid var(--canvas);border-radius:50%;background:#92b8aa;box-shadow:0 0 0 1px #b9d8cd}.entry.ai:before{background:var(--green);box-shadow:0 0 0 1px #83cbb3}.time{margin-bottom:9px;color:var(--muted);font-size:12px}
    .card{max-width:850px;padding:18px;border:1px solid var(--line);border-radius:7px;background:#fff;box-shadow:var(--shadow)}.user-card{margin-right:40px}.ai-card{border-color:#c8e5da}.msg-head{gap:9px;margin-bottom:14px;color:#42514e;font-size:13px}.msg-head b{color:var(--ink);font-size:14px}.tag{width:26px;height:26px;display:grid;place-items:center;border-radius:6px}.tag.user{background:#eff3f2;color:#5e6c68}.tag.ai{background:var(--mint);color:var(--green)}
    .shot-row{gap:16px}.shot{position:relative;flex:0 0 216px;aspect-ratio:16/9;overflow:hidden;border:1px solid #cbd8d4;border-radius:5px;background:linear-gradient(145deg,rgba(7,52,42,.18),transparent 55%),linear-gradient(125deg,#b9c9c2 0 28%,#5f7d76 28% 31%,#e4d5be 31% 62%,#8fa89f 62%)}.shot:before{content:"";position:absolute;inset:21% 16% 18% 42%;border:2px solid rgba(255,255,255,.78);border-radius:2px}.shot:after{content:"";position:absolute;left:46%;top:29%;width:23%;height:13%;border-top:2px solid rgba(255,255,255,.8);border-bottom:2px solid rgba(255,255,255,.8)}.shot label{position:absolute;left:8px;bottom:8px;padding:4px 6px;border-radius:4px;background:rgba(18,37,32,.72);color:#fff;font-size:10px}.prompt{margin:0;color:#293735;line-height:1.75;font-size:15px}.prompt span{color:var(--muted);font-size:12px}
    .diagnosis{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}.diagnosis h2{margin:0;color:#193832;font-size:18px;line-height:1.35}.status{flex:0 0 auto;padding:5px 8px;border-radius:4px;background:#fff5e9;color:var(--warn);font-size:12px}.summary{margin:0 0 15px;padding:11px 13px;border-left:3px solid #67b99a;background:var(--soft);color:#435450;font-size:14px;line-height:1.7}.steps{margin:0;padding-left:20px;color:#2d3a37}.steps li{padding-left:4px;margin:8px 0;line-height:1.65;font-size:14px}.steps strong{color:var(--green-dark)}.ai-note{display:flex;gap:7px;align-items:center;margin-top:15px;color:var(--muted);font-size:12px}.ai-note:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
    .dock-wrap{padding:0 clamp(16px,4vw,72px) 22px}.dock{width:min(1120px,100%);min-height:72px;margin:0 auto;padding:10px 12px 10px 16px;justify-content:space-between;gap:16px;border:1px solid #cadfd7;border-radius:8px;background:rgba(255,255,255,.98);box-shadow:0 10px 28px rgba(25,76,61,.12)}.dock-status{flex:1;min-width:0;gap:12px}.orb{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;background:var(--mint);color:var(--green)}.voice{min-width:0}.voice strong{display:block;font-size:14px}.voice span{display:block;margin-top:3px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wave{height:26px;display:flex;align-items:center;gap:3px;margin-left:auto;padding:0 8px}.wave i{display:block;width:3px;height:7px;border-radius:2px;background:#81c5ad}.wave i:nth-child(2),.wave i:nth-child(6){height:14px}.wave i:nth-child(3),.wave i:nth-child(5){height:20px}.wave i:nth-child(4){height:12px;background:var(--green)}.dock-actions{gap:9px}.action{min-width:112px;height:44px;padding:0 15px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#33423f;cursor:pointer;font-weight:700;font-size:14px}.action.primary{border-color:var(--green);background:var(--green);color:#fff}.action.primary:hover{background:var(--green-dark)}
    .panel{position:fixed;inset:0 0 0 auto;width:min(380px,92vw);padding:18px 20px 28px;background:#fff;border-left:1px solid var(--line);box-shadow:-18px 0 38px rgba(28,63,54,.14);transform:translateX(102%);transition:transform .22s ease;z-index:10;overflow:auto}.panel.open{transform:translateX(0)}.panel-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}.panel-top h2{margin:0;font-size:18px}.panel-subtitle{margin:4px 0 0;color:var(--muted);font-size:12px}.panel-section{margin-top:23px}.panel-section h3{margin:0 0 10px;color:#7b8985;font-size:12px;font-weight:700}.work-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.work-item{min-height:74px;padding:12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);text-align:left;cursor:pointer}.work-item:hover{border-color:#9ccfbd;background:var(--soft)}.work-item.active{border-color:#a8d8c7;background:#f2fbf7}.work-icon{display:block;margin-bottom:8px;color:var(--green);font-size:17px}.work-item b{display:block;font-size:13px}.work-item small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.command-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf2f0;color:#33423f;font-size:13px}.command-row:last-child{border-bottom:0}.command-row span{color:#84918d;font-size:12px}.toast{position:fixed;left:50%;bottom:108px;z-index:20;padding:10px 14px;border-radius:6px;background:#193b32;color:#fff;font-size:13px;box-shadow:0 10px 22px rgba(0,0,0,.17);transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s ease}.toast.show{transform:translate(-50%,0);opacity:1}
    .entry-main{width:min(940px,calc(100% - 32px));margin:0 auto;display:grid;place-items:center;padding:clamp(64px,13vh,155px) 0 82px}.entry-content{width:min(100%,760px);text-align:center}.entry-logo{width:54px;height:54px;margin:0 auto 24px;display:grid;place-items:center;border:1px solid #cce6dc;border-radius:14px;background:linear-gradient(145deg,#fbfffd,#dff3eb);color:var(--green);font-size:25px;font-weight:800;box-shadow:0 12px 26px rgba(12,139,104,.13)}.entry-content h1{margin:0;color:#1d2c29;font-size:clamp(28px,3vw,42px);font-weight:700;letter-spacing:0}.entry-content p{margin:13px 0 31px;color:var(--muted);font-size:15px}.askbar{height:72px;padding:8px 9px 8px 14px;display:flex;align-items:center;gap:12px;border:1px solid #d7e4e0;border-radius:10px;background:#fff;box-shadow:0 16px 42px rgba(29,66,56,.11);text-align:left}.ask-add{width:42px;height:42px;border:0;border-radius:7px;background:transparent;color:#40504c;font-size:29px;line-height:1;cursor:pointer}.ask-prompt{flex:1;min-width:0;color:#82908c;font-size:16px}.ask-mic{width:44px;height:44px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:19px;cursor:pointer;box-shadow:0 6px 15px rgba(12,139,104,.25)}.ask-mic:hover{background:var(--green-dark)}.entry-tools{display:flex;justify-content:center;gap:9px;margin-top:17px}.entry-tool{padding:8px 11px;border:0;border-radius:5px;background:transparent;color:#6d7c78;font-size:13px;cursor:pointer}.entry-tool:hover{background:#e8f4ef;color:var(--green-dark)}.entry-status{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:42px;color:#84908d;font-size:12px}.entry-status i{width:6px;height:6px;border-radius:50%;background:#1da77b}.entry-footer{position:fixed;right:clamp(18px,4vw,72px);bottom:28px;color:#8c9895;font-size:12px}
    @media(max-width:680px){.topbar{height:auto;min-height:58px;padding:8px 16px}.page-title>span,.state small,.conversation-head .hint,.wave{display:none}.page-title strong{font-size:15px}.page-title strong span{display:none}.actions{gap:8px}.state{padding:0}main{width:min(100% - 24px,1120px);padding-top:28px}.timeline{padding-left:25px}.timeline:before{left:8px}.conversation-head{margin-left:-25px;padding-left:25px}.entry:before{left:-21px}.card,.user-card{margin-right:0;padding:14px}.shot-row{align-items:flex-start;gap:11px}.shot{flex-basis:118px}.prompt{font-size:13px;line-height:1.6}.dock{align-items:center;padding:9px}.dock-wrap{padding:0 12px 12px}.dock-actions{gap:6px}.action{min-width:0;padding:0 9px;font-size:13px}.voice strong{font-size:13px}.entry-main{width:min(100% - 32px,940px);padding:88px 0}.entry-content h1{font-size:29px}.entry-content p{font-size:14px}.askbar{height:64px;padding-left:8px}.ask-prompt{font-size:14px}.entry-tools{margin-top:13px}.entry-footer{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="title"><button class="icon" title="返回" onclick="notice('已返回到项目列表')">&#8592;</button><div class="page-title"><strong>现场设备诊断 <span>#20260721</span></strong><span>AI 智能运维指导</span></div></div><div class="actions"><div class="state" title="接入后显示真实设备状态"><i class="dot"></i><span>Air3 已连接</span><small>状态已同步</small></div><button class="icon" title="语音命令" onclick="panel()">&#9776;</button></div></header>
    <main class="entry-main"><section class="entry-content"><div class="entry-logo">D</div><h1>叮当，今天要处理什么问题？</h1><p>直接说出现场情况，或拍照后补充问题描述</p><div class="askbar"><button class="ask-add" title="现场拍摄" onclick="capture()">+</button><span class="ask-prompt" id="voice-hint">说“叮当”后，直接开始描述</span><button class="ask-mic" title="语音提问" onclick="ask()">&#127908;</button></div><div class="entry-tools"><button class="entry-tool" onclick="capture()">&#128247; 现场拍摄</button><button class="entry-tool" onclick="notice('效果稿：专家协同入口')">&#128222; 呼叫专家</button><button class="entry-tool" onclick="panel()">&#9776; 语音命令</button></div><div class="entry-status"><i></i><span id="voice-title">叮当待命中</span></div></section></main>
    <div class="entry-footer">AI 智能运维指导</div>
  </div>
  <aside class="panel" id="panel"><div class="panel-top"><div><h2>运维工作台</h2><p class="panel-subtitle">AI 指导与现场运维能力</p></div><button class="icon" title="关闭" onclick="panel()">&#10005;</button></div><section class="panel-section"><h3>常用功能</h3><div class="work-grid"><button class="work-item active" onclick="panel();notice('当前已在 AI 指导')"><span class="work-icon">&#10022;</span><b>AI 指导</b><small>语音与图片诊断</small></button><button class="work-item" onclick="panel();notice('效果稿：专家协同入口')"><span class="work-icon">&#128222;</span><b>专家协同</b><small>远程音视频指导</small></button><button class="work-item" onclick="panel();notice('效果稿：设备巡检入口')"><span class="work-icon">&#10003;</span><b>设备巡检</b><small>按任务巡检设备</small></button><button class="work-item" onclick="panel();notice('效果稿：现场记录入口')"><span class="work-icon">&#128247;</span><b>现场记录</b><small>查看图片与过程</small></button></div></section><section class="panel-section"><h3>运维管理</h3><div class="work-grid"><button class="work-item" onclick="notice('效果稿：设备档案入口')"><span class="work-icon">&#9634;</span><b>设备档案</b><small>资产与设备信息</small></button><button class="work-item" onclick="notice('效果稿：运维工单入口')"><span class="work-icon">&#9744;</span><b>运维工单</b><small>任务处理与追踪</small></button><button class="work-item" onclick="notice('效果稿：运维知识库入口')"><span class="work-icon">&#128218;</span><b>运维知识库</b><small>标准与排查资料</small></button><button class="work-item" onclick="notice('效果稿：运维报告入口')"><span class="work-icon">&#9776;</span><b>运维报告</b><small>汇总任务证据</small></button></div></section><section class="panel-section"><h3>语音快捷命令</h3><div class="command-row"><b>叮当，拍照</b><span>抓拍现场</span></div><div class="command-row"><b>叮当，呼叫专家</b><span>发起协同</span></div><div class="command-row"><b>叮当，设备巡检</b><span>进入任务</span></div><div class="command-row"><b>叮当，返回</b><span>返回上一页</span></div></section></aside><div class="toast" id="toast"></div>
  <script>
    let timer; function notice(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),1800)}
    function panel(){document.getElementById('panel').classList.toggle('open')}
    function capture(){document.getElementById('voice-title').textContent='正在准备现场拍摄';document.getElementById('voice-hint').textContent='请保持视线稳定，拍摄完成后可直接描述问题';notice('效果稿：现场拍摄状态')}
    function ask(){document.getElementById('voice-title').textContent='正在听取语音';document.getElementById('voice-hint').textContent='请直接描述现场问题，停顿后将自动发送';notice('效果稿：语音识别状态')}
  </script>
</body>
</html>
