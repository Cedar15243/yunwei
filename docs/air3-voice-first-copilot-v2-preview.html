<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>叮当 AI 运维助手 V7.0 效果预览</title>
  <style>
    html,body{height:100%;margin:0;background:#edf3f1;font-family:"Microsoft YaHei",sans-serif}.preview{position:fixed;right:18px;bottom:18px;z-index:2;display:flex;gap:6px;padding:6px;border:1px solid rgba(36,84,69,.18);border-radius:10px;background:rgba(255,255,255,.78);box-shadow:0 10px 24px rgba(35,68,60,.12);backdrop-filter:blur(14px)}button{height:32px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:#31584c;font:inherit;font-size:12px;cursor:pointer}button:hover{background:rgba(7,139,104,.1)}iframe{width:100%;height:100%;border:0;display:block}@media(max-width:680px){.preview{right:8px;bottom:8px;max-width:calc(100% - 16px);overflow:auto}button{padding:0 8px;font-size:11px}}
  </style>
</head>
<body>
  <iframe id="hud" title="叮当 AI 运维助手 V7.0" src="../air3-dingdang-expert-integrated-app/app/src/main/assets/voice-first-hud.html"></iframe>
  <nav class="preview"><button data-state="standby">待命</button><button data-state="listening">监听</button><button data-state="analysis">分析</button><button data-state="diagnosis">诊断</button><button data-state="repair">维修</button><button data-state="complete">完成</button></nav>
  <script>
    document.querySelectorAll('[data-state]').forEach(function(button){button.addEventListener('click',function(){var hud=document.getElementById('hud').contentWindow; if(hud.HudPresentation) hud.HudPresentation.showState(button.dataset.state)})})
  </script>
</body>
</html>
